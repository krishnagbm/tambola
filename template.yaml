AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DabHousie — Stripe Payment Processing & Webhook Fulfillment

Parameters:
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe Secret API Key (sk_live_... or sk_test_...)
    Default: ''
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe Webhook Signing Secret (whsec_...)
    Default: ''
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Supabase Service Role Secret Key
    Default: ''

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - x86_64
    Environment:
      Variables:
        BASE_URL: 'https://www.dabhousie.com'
        SUPPORT_EMAIL: 'contact@dabhousie.com'
        SES_FROM_EMAIL: 'receipts@dabhousie.com'
        AWS_SES_REGION: 'us-east-2'

        # Supabase Config
        SUPABASE_URL: 'https://itfcnurjrnyalauwwdkj.supabase.co'
        SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
        SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0ZmNudXJqcm55YWxhdXd3ZGtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYwOTExNjEsImV4cCI6MjA1MTY2NzE2MX0.Rjfu9AEmNZJAEUVUDEj6GTC41HZPx1AiiVoMZTBEOOI'

        # Stripe Production / Test Keys (Injected via samconfig.toml parameter_overrides)
        STRIPE_SECRET_KEY: !Ref StripeSecretKey
        STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret

        # Stripe Price IDs (4 Core Packs: Small $2/15c, Standard $5/40c, Large $10/100c, Mega $20/300c)
        STRIPE_PRICE_SMALL:    'price_1UGi2yHN5g5gsWE0ZB2aEvIo'
        STRIPE_PRICE_STARTER:  'price_1UGi2yHN5g5gsWE0ZB2aEvIo'
        STRIPE_PRICE_STANDARD: 'price_1UGi3fHN5g5gsWE0qCLg1aUd'
        STRIPE_PRICE_FAMILY:   'price_1UGi3fHN5g5gsWE0qCLg1aUd'
        STRIPE_PRICE_LARGE:    'price_1UGi42HN5g5gsWE0a4kaJcCg'
        STRIPE_PRICE_PRO:      'price_1UGi42HN5g5gsWE0a4kaJcCg'
        STRIPE_PRICE_MEGA:     'price_1UGi4PHN5g5gsWE05k0sHIjW'

  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Requested-With,stripe-signature,Stripe-Signature'"
      AllowOrigin: "'*'"

Resources:
  # ── 1. Create Checkout Session Function ──────────────────────────
  CreateCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.create_checkout.handler
      Description: Generates Stripe Hosted Checkout Session for DabHousie credit packs
      Events:
        CheckoutPost:
          Type: Api
          Properties:
            Path: /checkout
            Method: post
        CreditsCheckoutPost:
          Type: Api
          Properties:
            Path: /credits/checkout
            Method: post
        CheckoutOptions:
          Type: Api
          Properties:
            Path: /checkout
            Method: options
        CreditsCheckoutOptions:
          Type: Api
          Properties:
            Path: /credits/checkout
            Method: options

  # ── 2. Stripe Webhook Fulfillment Function ─────────────────────────
  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.stripe_webhook.handler
      Description: Webhook receiver for Stripe checkout.session.completed events
      Policies:
        - SESCrudPolicy:
            IdentityName: '*'
      Events:
        WebhookPost:
          Type: Api
          Properties:
            Path: /webhook
            Method: post
        CreditsWebhookPost:
          Type: Api
          Properties:
            Path: /credits/webhook
            Method: post

  # ── 3. Email Dispatch Function ─────────────────────────────────────
  SendEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: functions.send_email.handler
      Description: Dispatches Private Party passcodes and notifications via AWS SES
      Policies:
        - SESCrudPolicy:
            IdentityName: '*'
      Events:
        EmailPost:
          Type: Api
          Properties:
            Path: /email/private-party
            Method: post
        EmailOptions:
          Type: Api
          Properties:
            Path: /email/private-party
            Method: options

Outputs:
  CheckoutApiEndpoint:
    Description: 'API Gateway endpoint URL for Checkout'
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/checkout'
  WebhookApiEndpoint:
    Description: 'Webhook URL to configure in Stripe Dashboard'
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/webhook'
  EmailApiEndpoint:
    Description: 'API Gateway endpoint URL for Private Party Email Dispatch'
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/email/private-party'
