version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ ! -d "flutter-sdk" ]; then git clone https://github.com/flutter/flutter.git --depth 1 -b stable flutter-sdk; fi
        - export PATH="$PATH:`pwd`/flutter-sdk/bin"
        - flutter doctor -v
        - printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nPURCHASE_ENABLED=%s\nPURCHASE_BASE_URL=%s\nAPP_ENVIRONMENT=%s\nENABLE_MOCK_CREDITS=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "${PURCHASE_ENABLED:-true}" "${PURCHASE_BASE_URL:-https://digitalappstudio.com/tambola/buy-credits}" "${APP_ENVIRONMENT:-production}" "${ENABLE_MOCK_CREDITS:-true}" > .env
    build:
      commands:
        - flutter pub get
        - >-
          flutter build web --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          --dart-define=PURCHASE_ENABLED="${PURCHASE_ENABLED:-true}"
          --dart-define=PURCHASE_BASE_URL="${PURCHASE_BASE_URL:-https://digitalappstudio.com/tambola/buy-credits}"
          --dart-define=APP_ENVIRONMENT="${APP_ENVIRONMENT:-production}"
          --dart-define=ENABLE_MOCK_CREDITS="${ENABLE_MOCK_CREDITS:-true}"
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - flutter-sdk/**/*
      - .pub-cache/**/*
