version: 1
frontend:
  phases:
    preBuild:
      commands:
        - if [ ! -d "flutter-sdk" ]; then git clone https://github.com/flutter/flutter.git --depth 1 -b stable flutter-sdk; fi
        - export PATH="$PATH:`pwd`/flutter-sdk/bin"
        - flutter doctor -v
        - printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nAPP_BASE_URL=%s\nSUPPORT_EMAIL=%s\nPURCHASE_ENABLED=%s\nPURCHASE_BASE_URL=%s\nCHECKOUT_API_URL=%s\nAPP_ENVIRONMENT=%s\nENABLE_MOCK_CREDITS=%s\n' "${SUPABASE_URL:-https://itfcnurjrnyalauwwdkj.supabase.co}" "${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0ZmNudXJqcm55YWxhdXd3ZGtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYwOTExNjEsImV4cCI6MjA1MTY2NzE2MX0.Rjfu9AEmNZJAEUVUDEj6GTC41HZPx1AiiVoMZTBEOOI}" "${APP_BASE_URL:-https://www.dabhousie.com}" "${SUPPORT_EMAIL:-contact@dabhousie.com}" "${PURCHASE_ENABLED:-true}" "${PURCHASE_BASE_URL:-https://www.dabhousie.com/pricing.html}" "${CHECKOUT_API_URL:-https://6uvajebdr2.execute-api.us-east-2.amazonaws.com/Prod/checkout}" "${APP_ENVIRONMENT:-production}" "${ENABLE_MOCK_CREDITS:-false}" > .env
    build:
      commands:
        - flutter pub get
        - >-
          flutter build web --release
          --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://itfcnurjrnyalauwwdkj.supabase.co}"
          --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0ZmNudXJqcm55YWxhdXd3ZGtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYwOTExNjEsImV4cCI6MjA1MTY2NzE2MX0.Rjfu9AEmNZJAEUVUDEj6GTC41HZPx1AiiVoMZTBEOOI}"
          --dart-define=APP_BASE_URL="${APP_BASE_URL:-https://www.dabhousie.com}"
          --dart-define=SUPPORT_EMAIL="${SUPPORT_EMAIL:-contact@dabhousie.com}"
          --dart-define=PURCHASE_ENABLED="${PURCHASE_ENABLED:-true}"
          --dart-define=PURCHASE_BASE_URL="${PURCHASE_BASE_URL:-https://www.dabhousie.com/pricing.html}"
          --dart-define=CHECKOUT_API_URL="${CHECKOUT_API_URL:-https://6uvajebdr2.execute-api.us-east-2.amazonaws.com/Prod/checkout}"
          --dart-define=APP_ENVIRONMENT="${APP_ENVIRONMENT:-production}"
          --dart-define=ENABLE_MOCK_CREDITS="${ENABLE_MOCK_CREDITS:-false}"
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - flutter-sdk/**/*
      - .pub-cache/**/*
