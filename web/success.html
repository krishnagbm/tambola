<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — DabHousie</title>
  <meta name="description" content="Thank you for your purchase. Your DabHousie host credits have been added successfully.">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --primary: #0B3D91;
      --accent: #FFC107;
      --bg-dark: #0A0E17;
      --card-bg: #121826;
      --card-border: #1E293B;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --success: #10B981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top center, #111c38 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--success);
      color: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    p.sub {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .details-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-val {
      font-weight: 700;
      color: #ffffff;
    }

    .credits-val {
      color: var(--accent);
      font-size: 16px;
    }

    .btn-return {
      display: block;
      width: 100%;
      background: var(--accent);
      color: #000000;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      padding: 16px;
      border-radius: 12px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-return:hover {
      background: #E0A800;
      transform: translateY(-2px);
    }

    .btn-home {
      display: inline-block;
      margin-top: 14px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13.5px;
    }

    .btn-home:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="success-icon">✓</div>
    <h1>Payment Completed!</h1>
    <p class="sub">Thank you! Your transaction has been approved by Stripe and your DabHousie host credits are active.</p>

    <div class="details-box">
      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-val" style="color:var(--success);">Completed / Verified</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Package</span>
        <span class="detail-val" id="plan-display">Family Pack</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Credits Added</span>
        <span class="detail-val credits-val" id="credits-display">+50 Credits</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Session Reference</span>
        <span class="detail-val" id="session-display" style="font-family:monospace; font-size:11px; color:var(--text-muted);">...</span>
      </div>
    </div>

    <a href="/#/wallet" class="btn-return">Return to DabHousie Wallet →</a>
    <a href="/#/" class="btn-home">Go to Home Screen</a>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const plan = params.get('plan') || 'family';
      const credits = params.get('credits') || '50';
      const sessionId = params.get('session_id') || 'Completed';

      const planMap = {
        'starter': 'Starter Pack (50 Credits)',
        'family': 'Family & Party Pack (150 Credits)',
        'family_plan': 'Family & Party Pack (150 Credits)',
        'standard': 'Standard Event Pack (150 Credits)',
        'party': 'Party Pack (300 Credits)',
        'pro': 'Pro Host Pack (300 Credits)',
        'gala': 'Mega Gala Pack (750 Credits)',
        'mega': 'Mega Community Pack (1500 Credits)',
      };

      document.getElementById('plan-display').textContent = planMap[plan.toLowerCase()] || plan;
      document.getElementById('credits-display').textContent = `+${credits} Credits`;
      document.getElementById('session-display').textContent = sessionId.length > 20 ? sessionId.substring(0, 20) + '...' : sessionId;
    })();
  </script>
</body>
</html>
