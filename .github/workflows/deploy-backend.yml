name: Deploy Backend (AWS SAM)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'template.yaml'
      - 'template*.yaml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-sam:
    name: Build & Deploy AWS SAM Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & Test
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
          pytest backend/tests

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: SAM Validate
        run: sam validate

      - name: SAM Build
        run: sam build --use-container=false

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name dabhousie-payments-backend \
            --region us-east-2 \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              StripeSecretKey="${{ secrets.STRIPE_SECRET_KEY }}" \
              StripeWebhookSecret="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
              SupabaseServiceRoleKey="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
